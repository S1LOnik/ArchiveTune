[package]
name = "archivetune_automix"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
jni = "0.21.1"
realfft = "3.5.0"
regex = "1.11"
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
