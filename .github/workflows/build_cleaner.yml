name: Build Cleaner

on:
  push:
    tags:
      - 'cleaner-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Cleaner APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cleaner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore persistent release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          else
            echo "::warning::KEYSTORE_BASE64 secret missing - APK will be signed with a random debug key"
          fi

      - name: Build Release APK
        shell: bash
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p release_assets
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK" release_assets/ArchiveTune-Cleaner-v1.0.apk
          ls -la release_assets/

      - name: Upload Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveTune-Cleaner-v1.0
          path: cleaner/release_assets/*

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'cleaner-v1.0' }}
          name: ArchiveTune Cleaner v1.0
          generate_release_notes: true
          files: cleaner/release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
