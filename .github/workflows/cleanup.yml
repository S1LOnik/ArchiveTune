name: Resource Cleanup
on: workflow_dispatch

concurrency:
  group: resource-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Clean and verify string resources
        run: cargo run --manifest-path tools/repo-maintainer/Cargo.toml --release -- cleanup strings

      - name: Remove unused drawable resources
        run: cargo run --manifest-path tools/repo-maintainer/Cargo.toml --release -- cleanup drawables

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Clean up Android resources
