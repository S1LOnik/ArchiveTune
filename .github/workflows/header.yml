name: Kotlin Header
on: workflow_dispatch

jobs:
  kotlin-header:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install addlicense
        run: go install github.com/google/addlicense@latest

      - name: Write Kotlin header banner
        run: |
          YEAR=$(date +%Y)
          cat > banner.txt <<EOF
          ArchiveTune ($YEAR)
          © Rukamori — github.com/rukamori
          GPL-3.0 License | Contributors: see git history
          Do not remove or alter this notice. - Per GPL-3.0 Section 4 & Section 5
          EOF

      - name: Find duplicate Kotlin headers
        run: cargo run --manifest-path tools/repo-maintainer/Cargo.toml --release -- header find-duplicates

      - name: Remove existing Kotlin headers
        run: cargo run --manifest-path tools/repo-maintainer/Cargo.toml --release -- header remove

      - name: Add current Kotlin header
        run: |
          find . -path "./.git" -prune -o -path "*/build" -prune -o -type f -name "*.kt" -print0 | xargs -0 -r "$(go env GOPATH)/bin/addlicense" -v -f banner.txt
          rm banner.txt

      - name: Verify Kotlin headers are unique
        run: cargo run --manifest-path tools/repo-maintainer/Cargo.toml --release -- header verify

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Kotlin Header
